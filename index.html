<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Yoake" />
  <meta name="theme-color" content="#05060a" />
  <title>Yoake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600&family=Monoton&family=Nunito:wght@600;700&family=Yuji+Syuku&display=swap" rel="stylesheet" />
  <style>
    /* Lamplight: frosted cocoa glass, amber lamplight, soft rounded type */
    :root {
      --bg: #05060a; --glass: rgba(48,28,18,.62); --glass-edge: rgba(255,220,170,.16);
      --cream: #fbefdc; --ink: #efe0c8; --muted: #cdb497; --label: #e8cfae; --glow: #ffe2b0;
      --amber: #f0b45a; --cocoa: #3a2216; --chip: rgba(255,236,210,.12);
      --shade: 22,12,6;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #app canvas { display: block; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .glass { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 0 0 1px var(--glass-edge), 0 14px 30px rgba(0,0,0,.35); }
    .hand { font-family: Caveat, cursive; font-weight: 600; }
    .neon { font-family: Monoton, cursive; font-weight: 400; color: #ffd9de; letter-spacing: 2px; line-height: 1.1;
      text-shadow: 0 0 6px #ff5a6e, 0 0 18px #ff2a46, 0 0 42px #ff1a3a, 0 0 80px rgba(255,30,60,.6); animation: buzz 7s infinite; }
    .neon.amber { color: var(--glow); text-shadow: 0 0 8px var(--amber), 0 0 26px rgba(240,160,60,.7), 0 0 60px rgba(240,140,40,.4); animation: none; }
    @keyframes buzz { 0%, 91%, 93%, 96%, 100% { opacity: 1; } 92%, 95% { opacity: .55; } }
    @keyframes breathe { 50% { opacity: .45; } }
    .pill-btn { background: var(--amber); color: var(--cocoa); border-radius: 999px; padding: 15px 34px; font: 600 22px Fredoka, sans-serif;
      box-shadow: 0 0 24px rgba(240,180,90,.35); transition: transform .15s ease, box-shadow .15s ease; }
    .pill-btn:hover:not([disabled]) { transform: translateY(-1px); box-shadow: 0 0 32px rgba(240,180,90,.55); }
    .pill-btn[disabled] { background: var(--chip); color: var(--muted); box-shadow: none; cursor: default; font-size: 18px; animation: breathe 3s ease-in-out infinite; }
    .text-btn { font: 600 18px Fredoka, sans-serif; color: var(--muted); }
    .text-btn:hover { color: var(--cream); }
    .chip { background: var(--chip); border-radius: 999px; padding: 9px 16px; font: 700 15px Nunito, sans-serif; color: var(--cream); }
    .chip:hover { background: rgba(255,236,210,.2); }
    .chip.on { background: var(--amber); color: var(--cocoa); }
    .lbl { font: 700 15px Nunito, sans-serif; color: var(--muted); }
    kbd { background: rgba(255,236,210,.16); border-radius: 7px; padding: 2px 8px; color: var(--cream); font: inherit; }

    /* ---------------------------------------------------------------- full-screen menus */
    #overlay { position: fixed; inset: 0; color: var(--cream); user-select: none; transition: opacity .6s ease; font-family: Fredoka, sans-serif; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--shade),.86) 0%, rgba(var(--shade),.55) 40%, rgba(var(--shade),0) 70%); transition: all .6s ease; }
    #overlay.dim .shade { background: radial-gradient(ellipse at 50% 45%, rgba(255,190,110,.10), rgba(10,5,2,.62) 75%); }
    #overlay.blur .shade { backdrop-filter: blur(3px) brightness(.7); -webkit-backdrop-filter: blur(3px) brightness(.7);
      background: radial-gradient(ellipse at 28% 55%, rgba(255,196,120,.22), rgba(var(--shade),.25) 45%, rgba(var(--shade),.4)); }
    #screen { position: absolute; inset: 0; }
    .col { position: absolute; left: clamp(20px, 7.5vw, 96px); top: clamp(40px, 12vh, 110px); bottom: clamp(40px, 10vh, 90px); width: min(560px, calc(100vw - 40px));
      display: flex; flex-direction: column; gap: clamp(18px, 3.4vh, 34px); }
    .title { font-size: clamp(40px, 5vw, 64px); }
    .tagline { font-size: 26px; color: var(--label); }
    .items { display: flex; flex-direction: column; gap: 6px; }
    .item { display: flex; align-items: center; gap: 16px; font-size: clamp(22px, 2.4vw, 28px); color: var(--ink); padding-left: 28px; text-align: left; width: fit-content; transition: color .15s ease; }
    .item .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 14px var(--amber); display: none; margin-left: -28px; }
    .item.on, .item:hover { color: var(--glow); text-shadow: 0 0 18px rgba(240,180,90,.55); padding-left: 0; }
    .item.on .dot, .item:hover .dot { display: block; }
    .items:hover .item.on:not(:hover) { color: var(--ink); text-shadow: none; padding-left: 28px; }
    .items:hover .item.on:not(:hover) .dot { display: none; }
    .item.big { font-size: clamp(26px, 2.8vw, 34px); font-weight: 500; }
    .tip { font: 600 15px Nunito, sans-serif; color: var(--muted); margin-top: auto; }
    .err { font: 700 15px Nunito, sans-serif; color: #ffb8a4; }
    .wait { font: 500 20px Fredoka, sans-serif; color: #a8927e; animation: breathe 3s ease-in-out infinite; }
    .loading { font-size: 22px; color: var(--muted); animation: breathe 3s ease-in-out infinite; }

    /* main menu: who you are, bottom right */
    .me-card { position: absolute; right: clamp(16px, 5.6vw, 72px); bottom: clamp(16px, 9vh, 72px); display: flex; align-items: center; gap: 18px;
      padding: 16px 26px 16px 16px; border-radius: 28px; text-align: left; }
    .me-card .pv { width: 84px; height: 104px; border-radius: 20px; overflow: hidden; background: radial-gradient(ellipse at 50% 75%, rgba(255,196,120,.22), rgba(255,196,120,.04) 70%); }
    .me-card .pv canvas { width: 84px; height: 104px; display: block; }
    .me-card .nm { font: 500 28px Fredoka, sans-serif; }
    .me-card .st { font: 600 14px Nunito, sans-serif; color: var(--muted); }
    .me-card .ch { font: 700 14px Nunito, sans-serif; color: var(--amber); margin-top: 4px; }
    .me-card:hover .ch { text-decoration: underline; }

    /* customize: step into the light */
    .stage { position: absolute; left: clamp(20px, 11vw, 150px); top: 50%; transform: translateY(-50%); width: 420px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .stage .glowpool { position: absolute; left: 0; top: -40px; width: 420px; height: 620px; border-radius: 50%; background: radial-gradient(ellipse at 50% 60%, rgba(255,196,120,.32), rgba(255,196,120,0) 65%); pointer-events: none; }
    .stage .pv canvas { width: 260px; height: 480px; display: block; position: relative; }
    .stage .name-row { display: flex; align-items: center; gap: 12px; position: relative; }
    .round { width: 44px; height: 44px; border-radius: 50%; background: rgba(48,28,18,.7); box-shadow: inset 0 0 0 1px rgba(255,220,170,.2); font: 600 22px Fredoka, sans-serif; color: var(--cream); flex-shrink: 0; }
    .round:hover { background: rgba(80,48,30,.85); }
    .name-in { width: 180px; text-align: center; font: 500 30px Fredoka, sans-serif; color: var(--cream); background: transparent; border: 0; border-bottom: 2px dashed transparent; outline: none; padding: 2px 0; }
    .name-in:hover, .name-in:focus { border-bottom-color: rgba(240,180,90,.5); }
    .look { position: absolute; right: clamp(16px, 5vw, 64px); top: clamp(16px, 8vh, 64px); bottom: clamp(16px, 8vh, 64px); width: min(520px, calc(100vw - 32px));
      box-sizing: border-box; padding: 32px 34px; border-radius: 30px; display: flex; flex-direction: column; gap: 18px; }
    .look .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; margin: 0 -10px; padding: 4px 10px; scrollbar-width: thin; scrollbar-color: rgba(240,180,90,.4) transparent; }
    .look .head { display: flex; justify-content: space-between; align-items: baseline; }
    .look .head > div { font: 500 32px Fredoka, sans-serif; }
    .look .head button { font: 700 24px Caveat, cursive; color: var(--amber); }
    .look section { display: flex; flex-direction: column; gap: 10px; }
    .look .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .look .row.chips { gap: 8px; }
    .sw { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    .sw.on { box-shadow: 0 0 0 3px #3a2216, 0 0 0 5px var(--amber), 0 0 16px rgba(240,180,90,.6); }
    .look .pill-btn { margin-top: auto; padding: 15px; font-size: 20px; flex-shrink: 0; }

    /* lobby: the code on the door sign */
    .code { font-size: clamp(64px, 8vw, 96px); letter-spacing: 18px; line-height: 1; }
    .code-in { width: 4.6em; font: 400 clamp(56px, 7vw, 84px) Monoton, cursive; letter-spacing: 14px; color: var(--glow); background: transparent; border: 0;
      border-bottom: 2px dashed rgba(240,180,90,.4); outline: none; text-transform: uppercase; text-shadow: 0 0 8px var(--amber), 0 0 26px rgba(240,160,60,.7); }
    .code-in::placeholder { color: rgba(255,226,176,.18); text-shadow: none; }
    .people { display: flex; flex-direction: column; gap: 8px; }
    .person { display: flex; align-items: center; gap: 14px; border-radius: 20px; padding: 10px 18px 10px 10px; }
    .person .av { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
    .person .nm { font: 500 22px Fredoka, sans-serif; flex: 1; }
    .person .note { font: 700 20px Caveat, cursive; color: var(--muted); }
    .person .note.host { color: var(--amber); }
    .person.empty { box-shadow: inset 0 0 0 1.5px rgba(255,220,170,.18); }
    .person.empty .av { box-sizing: border-box; border: 2px dashed rgba(255,220,170,.3); }
    .actions { margin-top: auto; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

    /* pause: a quiet side menu */
    .sliders { display: flex; flex-direction: column; gap: 16px; padding: 22px 24px; border-radius: 24px; }
    .slider { display: flex; align-items: center; gap: 14px; }
    .slider span { width: 92px; }
    .slider input { flex: 1; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 999px; outline: none;
      background: linear-gradient(90deg, var(--amber) var(--p, 50%), rgba(255,236,210,.14) var(--p, 50%)); }
    .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px rgba(240,180,90,.5); cursor: pointer; }
    .slider input::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--glow); cursor: pointer; }
    .keys { position: absolute; right: clamp(16px, 4.4vw, 56px); bottom: clamp(16px, 6vh, 48px); display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
      padding: 12px 20px; border-radius: 999px; font: 500 15px Fredoka, sans-serif; color: var(--ink); max-width: calc(100vw - 32px); box-sizing: border-box; }
    .keys > span { display: flex; align-items: center; gap: 6px; }

    /* catalog: things to buy between nights */
    .purse-big { font: 500 40px Fredoka, sans-serif; color: var(--glow); display: flex; align-items: baseline; gap: 10px; }
    .purse-big span { font: 700 15px Nunito, sans-serif; color: var(--muted); }
    .look.catalog { width: min(560px, calc(100vw - 32px)); }
    .buy { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid rgba(255,220,170,.1); }
    .buy .what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .buy .what b { font: 500 19px Fredoka, sans-serif; color: var(--cream); }
    .buy .what span { font: 600 14px Nunito, sans-serif; color: var(--muted); }
    .buy .chip { flex-shrink: 0; min-width: 84px; font-variant-numeric: tabular-nums; }
    .buy .chip[disabled] { opacity: .5; cursor: default; }
    .buy .chip.on[disabled] { opacity: 1; }
    .buy.later .what b { color: var(--muted); }

    /* the Fami-Com: the game plays on the CRT in the room; all that's on top is a strip of controls along the bottom */
    #arcade { position: fixed; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 40;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); box-sizing: border-box; pointer-events: none;
      background: linear-gradient(to top, rgba(6,5,8,.7), rgba(6,5,8,0)); }
    #arcade > * { pointer-events: auto; }
    body.arcade #arcade { display: flex; }
    body.arcade #overlay, body.arcade .hud, body.arcade #reticle, body.arcade #hint { display: none; }
    #arcade .hint { font: 600 15px Nunito, sans-serif; color: var(--cream); opacity: .85; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    #arcade .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    #arcade .pads { display: none; gap: 10px; }
    body.touch #arcade .pads { display: flex; }
    #arcade .pads button { width: 56px; height: 56px; border-radius: 16px; background: rgba(255,236,210,.12); color: var(--cream); font: 600 20px Fredoka, sans-serif; touch-action: none; }
    #arcade .pads button.a { background: #b8282a; border-radius: 50%; }

    /* the telescope: a round brass field of view, everything else dark */
    #scope { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .45s ease; z-index: 30;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0, rgba(0,0,0,0) 31vmin, rgba(0,0,0,.65) 34vmin, #000 35.5vmin); }
    #scope::before { content: ''; position: absolute; left: 50%; top: 50%; width: 70vmin; height: 70vmin; transform: translate(-50%, -50%); border-radius: 50%;
      box-shadow: 0 0 0 1.4vmin rgba(150, 112, 52, .6), 0 0 0 1.9vmin rgba(60, 40, 16, .8), inset 0 0 7vmin 1vmin rgba(0, 0, 0, .75); }
    #scope::after { content: ''; position: absolute; left: 50%; top: 50%; width: 70vmin; height: 70vmin; transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, rgba(200, 220, 255, .10), rgba(200, 220, 255, 0) 22%); }
    #scope .hint { position: absolute; left: 0; right: 0; bottom: 5vh; text-align: center; font: 600 15px Nunito, sans-serif; color: var(--cream); opacity: .7; }
    body.scope #scope { opacity: 1; }
    body.scope .hud, body.scope #reticle, body.scope #hint, body.scope #toast { opacity: 0 !important; }

    /* ---------------------------------------------------------------- the fade between scenes (sunrise, sleep) */
    #fade { position: fixed; inset: 0; background: #05060a; opacity: 0; pointer-events: none; transition: opacity .9s ease; z-index: 50;
      display: flex; align-items: center; justify-content: center; }
    #fade.on { opacity: 1; }
    #fade .cap { font: 600 30px Caveat, cursive; color: var(--label); opacity: 0; transition: opacity 1.2s ease .3s; }
    #fade.on .cap.show { opacity: 1; }

    /* ---------------------------------------------------------------- closed for the night */
    #summary { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-end; gap: 20px; color: var(--cream);
      font-family: Fredoka, sans-serif; background: linear-gradient(180deg, rgba(10,5,2,0) 20%, rgba(10,5,2,.6) 100%); padding: 16px 16px 6vh; box-sizing: border-box; text-shadow: 0 2px 12px rgba(20,8,4,.55); }
    body.summary #summary { display: flex; }
    body.summary #overlay { display: none; }
    body.summary #toast, body.summary #pop { display: none; }
    #summary .actions { margin-top: 0; justify-content: center; }
    #summary .when { font-size: 28px; color: var(--label); text-align: center; }
    /* the night's card waits for the sun to come up behind it */
    body.summary #summary { animation: sumIn 2.4s ease 4.5s both; }
    body.summary #summary > * { animation: sumRise 1.2s ease 5s both; }
    @keyframes sumIn { from { opacity: 0; } }
    @keyframes sumRise { from { opacity: 0; transform: translateY(12px); } }
    #summary .closed { font-size: clamp(42px, 5vw, 58px); word-spacing: .3em; text-align: center; }
    #summary .stars { font-size: 30px; color: var(--amber); letter-spacing: 4px; text-shadow: 0 0 12px rgba(240,180,90,.6); text-align: center; }
    #summary .stars i { color: rgba(255,236,210,.25); font-style: normal; text-shadow: none; }
    #summary .stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    #summary .stat { width: 170px; padding: 18px 20px; border-radius: 24px; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box; }
    #summary .stat b { font: 500 38px Fredoka, sans-serif; }
    #summary .stat span { font: 700 15px Nunito, sans-serif; color: var(--muted); }
    #summary .small { font: 600 15px Nunito, sans-serif; color: var(--muted); text-align: center; }
    #summary .unlock { display: flex; align-items: center; gap: 16px; width: min(538px, 100%); box-sizing: border-box; padding: 16px 20px; border-radius: 24px;
      background: rgba(240,180,90,.14); box-shadow: inset 0 0 0 1.5px rgba(240,180,90,.55), 0 0 30px rgba(240,180,90,.15); }
    #summary .unlock .ic { width: 56px; height: 56px; flex-shrink: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px;
      background: repeating-linear-gradient(135deg, rgba(255,200,120,.22) 0 5px, rgba(255,200,120,.08) 5px 10px); }
    #summary .unlock b { display: block; font: 500 21px Fredoka, sans-serif; color: var(--glow); }
    #summary .unlock span { font: 600 15px Nunito, sans-serif; color: var(--label); }

    /* ---------------------------------------------------------------- in the shop */
    .hud { position: fixed; opacity: 0; transition: opacity .6s ease; pointer-events: none; color: var(--cream); font-family: Fredoka, sans-serif; }
    body.playing #orders, body.playing #schedule, body.playing #intro, body.playing #purse { opacity: 1; }
    #purse { right: 28px; top: 132px; padding: 6px 16px; border-radius: 999px; font: 500 18px Fredoka, sans-serif; color: var(--glow); font-variant-numeric: tabular-nums; }
    #orders { left: 28px; top: 28px; width: 176px; box-sizing: border-box; padding: 14px 14px 12px; border-radius: 24px; display: flex; flex-direction: column; gap: 6px; }
    #orders:empty { display: none; }
    #orders .ttl { font-size: 22px; color: var(--label); line-height: 1; padding-left: 2px; }
    #orders .line { display: flex; align-items: center; gap: 10px; }
    #orders .tile { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,236,210,.10); display: flex; align-items: center; justify-content: center; }
    #orders .tile img { width: 34px; height: 34px; image-rendering: pixelated; }
    #orders .n { font: 500 21px Fredoka, sans-serif; }
    #orders .line.done { opacity: .55; }
    #orders .belt { font: 700 13px Nunito, sans-serif; color: var(--amber); white-space: nowrap; }
    #orders .rule { height: 1px; background: rgba(255,220,170,.16); margin: 4px 2px; }
    #orders .tags { display: flex; gap: 8px; }
    #orders .tag { border-radius: 999px; padding: 3px 12px; font: 600 16px Fredoka, sans-serif; }
    #orders .tag.ord { background: rgba(201,86,63,.28); color: #ffb8a4; }
    #orders .tag.pay { background: rgba(80,160,90,.25); color: #a8e0a8; }
    #orders .quiet { font-size: 20px; color: var(--muted); padding: 2px; }
    #schedule { right: 28px; top: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    #schedule .time { display: flex; align-items: baseline; gap: 6px; padding: 9px 20px 9px 18px; border-radius: 999px; }
    #schedule .time b { font: 500 28px Fredoka, sans-serif; line-height: 1; }
    #schedule .time span { font: 500 16px Fredoka, sans-serif; color: var(--muted); }
    #schedule .bar { position: relative; width: 200px; height: 10px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-edge); }
    #schedule .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--amber); box-shadow: 0 0 10px rgba(240,180,90,.7); }
    #schedule .bar u { position: absolute; top: 1px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #ffb8a4; box-shadow: 0 0 8px rgba(255,150,120,.7); }
    #schedule .bar u.past { background: rgba(255,184,164,.35); box-shadow: none; }
    #schedule .status { display: flex; align-items: center; gap: 8px; font-size: 22px; color: var(--glow); text-shadow: 0 2px 8px rgba(0,0,0,.8); }
    #schedule .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    #schedule .status.calm::before { background: var(--muted); box-shadow: none; }
    #pop { right: 40px; top: 160px; font-size: 30px; color: var(--glow); text-shadow: 0 0 14px rgba(240,180,90,.7), 0 2px 8px rgba(0,0,0,.8);
      transform: rotate(-4deg); transition: opacity .5s ease, transform .5s ease; }
    #pop.show { opacity: 1 !important; transform: rotate(-4deg) translateY(-8px); }
    #toast { left: 50%; top: 28px; transform: translateX(-50%); padding: 8px 18px; border-radius: 999px; font: 500 16px Fredoka, sans-serif; white-space: nowrap;
      max-width: calc(100vw - 480px); overflow: hidden; text-overflow: ellipsis; transition: opacity .4s ease; }
    #toast.show { opacity: 1 !important; }
    #intro { left: 50%; bottom: 28px; transform: translateX(-50%); padding: 9px 18px; border-radius: 999px; font: 500 15px Fredoka, sans-serif; color: var(--ink); white-space: nowrap; }
    #intro.gone { opacity: 0 !important; }
    #reticle { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,226,176,.55); pointer-events: none; transition: all .15s ease; }
    #reticle.active { width: 8px; height: 8px; margin: -4px; background: var(--glow); box-shadow: 0 0 10px rgba(240,180,90,.9); }
    #hint { position: fixed; left: 50%; top: calc(50% + 24px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; border-radius: 999px;
