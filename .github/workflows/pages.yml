# Publishes the game to GitHub Pages (solo play only; co-op needs the Cloudflare relay, see deploy.sh),
# and runs the end-to-end playtest. To turn the site on: repository Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main, claude/happy-galileo-1cnpth]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site (just the page and its modules; there is no build step)
        run: mkdir -p _site && cp index.html _site/ && cp -R src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4

  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run playtest
