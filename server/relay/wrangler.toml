# The co-op relay. It has no public URL of its own: the Pages site reaches it through a binding.
# Deploy: npx wrangler deploy (from this folder). Local dev: npx wrangler dev --port 8787
name = "yoake-relay"
main = "relay.js"
compatibility_date = "2026-10-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
